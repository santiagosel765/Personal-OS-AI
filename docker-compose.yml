services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_os_dev
    ports:
      - "5432:5432"
    volumes:
      - personal_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_os_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personal_os_pgdata:
